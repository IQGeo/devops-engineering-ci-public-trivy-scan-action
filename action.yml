name: 'Reusable composite action for Trivy vulnerability scanning'
inputs:
  image:
    description: 'Container image to scan'
    required: true
    type: string
  severity_threshold:
    description: 'Vulnerability severity threshold (LOW, MEDIUM, HIGH, CRITICAL)'
    required: false
    default: 'MEDIUM,CRITICAL,HIGH'
    type: string
  format:
    description: 'Output format (table, json, template, cyclonedx, spdx-json, spdx-tag-value, github)'
    required: false
    default: 'github'
    type: string
  output:
    description: 'Output file name'
    required: false
    default: 'scan-results.sbom.json'
    type: string
  acr:
    description: 'Azure Container Registry (ACR) URL'
    required: true
    type: string
  registry_username:
    description: 'ACR registry username'
    required: true
    type: string
  registry_password:
    description: 'ACR registry password'
    required: true
    type: string
  token:
    description: 'GitHub token for authentication'
    required: true
    type: string


runs:
    using: "composite"
    steps:

      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'login to ACR'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.acr }}
          username: ${{ inputs.registry_username }}
          password: ${{ inputs.registry_password }}

      - name: Pull image
        shell: bash
        run: docker pull ${{ inputs.image }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ inputs.image }}'
          scan-type: image
          format: '${{ inputs.format }}'
          output: '${{ inputs.output }}'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: '${{ inputs.severity_threshold }}'
          github-pat: '${{ inputs.token }}'

      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: '${{ github.workspace }}/trivy-report.txt'
          retention-days: 1